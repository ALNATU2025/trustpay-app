name: trustpay_app
description: TrustPay mobile app (entry, onboarding, sign up, login, home and services).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  pdf: ^3.11.1
  printing: ^5.13.1
  barcode: ^2.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
